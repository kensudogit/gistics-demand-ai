name: Checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill
        run: python logistics-demand-ai/scripts/validate_skill.py
      - name: API tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -q
